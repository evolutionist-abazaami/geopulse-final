# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow will install Deno then run `deno lint` and `deno test`.
# For more information see: https://github.com/denoland/setup-deno

name: Deno

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Setup repo
        uses: actions/checkout@v4

      - name: Setup Deno
        # uses: denoland/setup-deno@v1
        uses: denoland/setup-deno@61fe2df320078202e33d7d5ad347e7dcfa0e8f31  # v1.1.2
        with:
          deno-version: v1.x

      # Uncomment this step to verify the use of 'deno fmt' on each commit.
      # - name: Verify formatting
      #   run: deno fmt --check

      # Scoped to supabase/functions via deno.json. Lint debt predates this
      # workflow (see the platform review) - surfaced here without blocking
      # merges. Drop continue-on-error once that debt is paid down.
      - name: Run linter
        run: deno lint
        continue-on-error: true

      # No edge function tests exist yet - re-enable once supabase/functions
      # has real *_test.ts files, otherwise this just fails with "no test
      # modules found" on every run.
      # - name: Run tests
      #   run: deno test -A
