# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow installs Deno and checks/tests the Supabase edge functions.
# For more information see: https://github.com/denoland/setup-deno

name: Deno

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Setup repo
        uses: actions/checkout@v4

      - name: Setup Deno
        # uses: denoland/setup-deno@v1
        uses: denoland/setup-deno@61fe2df320078202e33d7d5ad347e7dcfa0e8f31  # v1.1.2
        with:
          deno-version: v1.x

      # Uncomment this step to verify the use of 'deno fmt' on each commit.
      # - name: Verify formatting
      #   run: deno fmt --check

      # Scoped to supabase/functions via deno.json. Lint debt predates this
      # workflow (see the platform review) - surfaced here without blocking
      # merges. Drop continue-on-error once that debt is paid down.
      - name: Run linter
        run: deno lint
        continue-on-error: true

      - name: Check Supabase function entry points
        run: find supabase/functions -mindepth 2 -maxdepth 2 -name index.ts -print0 | xargs -0 deno check --no-lock

      - name: Run tests
        run: deno test --allow-net=deno.land supabase/functions
